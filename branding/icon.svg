<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="scanned" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
    <clipPath id="doc">
      <path d="M36 16 H78 L96 34 V112 H36 Z"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>

  <!-- Document with folded corner -->
  <g filter="url(#shadow)">
    <path d="M36 16 H78 L96 34 V108 a4 4 0 0 1 -4 4 H40 a4 4 0 0 1 -4 -4 V20 a4 4 0 0 1 4 -4 Z" fill="#FFFFFF"/>
  </g>
  <path d="M78 16 V30 a4 4 0 0 0 4 4 H96 Z" fill="#CBD5E1"/>

  <!-- Text lines -->
  <g fill="#CBD5E1">
    <rect x="45" y="30" width="26" height="5" rx="2.5"/>
    <rect x="45" y="42" width="42" height="5" rx="2.5"/>
    <rect x="45" y="52" width="36" height="5" rx="2.5"/>
  </g>

  <!-- Already-scanned area glow -->
  <rect x="36" y="38" width="60" height="28" fill="url(#scanned)" clip-path="url(#doc)"/>

  <!-- Scan beam -->
  <rect x="20" y="64" width="88" height="7" rx="3.5" fill="#10B981"/>
  <rect x="20" y="64" width="88" height="2.5" rx="1.25" fill="#6EE7B7"/>

  <!-- PDF badge -->
  <rect x="45" y="84" width="42" height="18" rx="4" fill="#DC2626"/>
  <text x="66" y="97.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold"
        font-size="12.5" letter-spacing="0.6" fill="#FFFFFF">PDF</text>
</svg>
