name: Build Scan Bridge (.exe)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0.1). Leave empty to only build."
        required: false
        default: ""
  push:
    tags: ["v*"]
    paths:
      - "bridge/**"
      - ".github/workflows/build-bridge.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Code signing is optional: each method runs only when its secrets are set (Settings → Secrets → Actions).
      #   SSL.com eSigner (cloud):  ES_USERNAME, ES_PASSWORD, ES_TOTP_SECRET, ES_CREDENTIAL_ID (optional)
      #   Certificate file (.pfx):  CODE_SIGNING_PFX (base64 of the .pfx), CODE_SIGNING_PFX_PASSWORD
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
      CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish bridge/ScanBridge/ScanBridge.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      # ---------- Code signing ----------
      - name: Sign exe (SSL.com eSigner)
        if: env.ES_USERNAME != ''
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/publish/Scan2PdfBridge.exe
          output_path: ${{ github.workspace }}/signed
          environment_name: PROD
          malware_block: false

      - name: Use eSigner output
        if: env.ES_USERNAME != ''
        shell: pwsh
        run: Copy-Item signed/Scan2PdfBridge.exe publish/Scan2PdfBridge.exe -Force

      - name: Sign exe (certificate file)
        if: env.ES_USERNAME == '' && env.CODE_SIGNING_PFX != ''
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGNING_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            /d "Scan 2 PDF Bridge" /du "https://scan2pdf.aghapyts.com" publish\Scan2PdfBridge.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx -Force

      - name: Report signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature publish/Scan2PdfBridge.exe
          if ($sig.Status -eq 'Valid') {
            "Signed by: $($sig.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY
            Write-Host "Signature valid: $($sig.SignerCertificate.Subject)"
          } elseif ($env:ES_USERNAME -or $env:CODE_SIGNING_PFX) {
            throw "Signing was configured but the exe signature is $($sig.Status)"
          } else {
            "⚠️ Unsigned build (no signing secrets configured)" >> $env:GITHUB_STEP_SUMMARY
            Write-Host "Unsigned build"
          }

      - name: Package with install scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/Scan2PdfBridge | Out-Null
          Copy-Item publish/Scan2PdfBridge.exe, publish/appsettings.json out/Scan2PdfBridge/
          Copy-Item bridge/install.cmd, bridge/uninstall.cmd, bridge/install.ps1, bridge/uninstall.ps1, LICENSE out/Scan2PdfBridge/
          Compress-Archive -Path out/Scan2PdfBridge -DestinationPath Scan2PdfBridge-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Scan2PdfBridge-win-x64
          path: Scan2PdfBridge-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Scan 2 PDF ${{ inputs.release_tag || github.ref_name }}
          files: Scan2PdfBridge-win-x64.zip
          generate_release_notes: true

  # ---------- Microsoft Store edition (MSIX). Microsoft signs it on publish: no certificate needed. ----------
  msix:
    needs: build   # run after the exe job so both don't race to create the same release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish app layout (self-contained, not single-file)
        run: >
          dotnet publish bridge/ScanBridge/ScanBridge.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o msix/layout

      - name: Generate AppxManifest and assets
        shell: pwsh
        run: |
          [xml]$proj = Get-Content bridge/ScanBridge/ScanBridge.csproj
          $ver = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $parts = $ver.Split('.') + @('0','0','0')
          $msixVersion = "{0}.{1}.{2}.0" -f $parts[0], $parts[1], $parts[2]   # Store requires the 4th part to be 0
          $id = Get-Content bridge/Package/store-identity.json -Raw | ConvertFrom-Json
          $xml = (Get-Content bridge/Package/AppxManifest.xml -Raw).
            Replace('__IDENTITY_NAME__', $id.identityName).
            Replace('__PUBLISHER_DISPLAY_NAME__', $id.publisherDisplayName).
            Replace('__PUBLISHER__', $id.publisher).
            Replace('__VERSION__', $msixVersion)
          Set-Content -Path msix/layout/AppxManifest.xml -Value $xml -Encoding UTF8
          Copy-Item bridge/Package/Images msix/layout/Images -Recurse -Force
          "MSIX_VERSION=$msixVersion" >> $env:GITHUB_ENV
          "MSIX_PUBLISHER=$($id.publisher)" >> $env:GITHUB_ENV
          "Package identity: $($id.identityName) / $($id.publisher) / v$msixVersion" >> $env:GITHUB_STEP_SUMMARY

      - name: Pack MSIX
        shell: pwsh
        run: |
          $kits = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64" -Directory | Sort-Object Name -Descending
          $makeappx = ($kits | ForEach-Object { Join-Path $_.FullName 'makeappx.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1)
          New-Item -ItemType Directory -Force out | Out-Null
          & $makeappx pack /d msix/layout /p out/Scan2PdfBridge-Store.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          "MAKEAPPX=$makeappx" >> $env:GITHUB_ENV

      - name: Make a test-signed copy for local install
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:MSIX_PUBLISHER `
            -KeyUsage DigitalSignature -FriendlyName "Scan 2 PDF Bridge TEST" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") -NotAfter (Get-Date).AddYears(2)
          $plain = [guid]::NewGuid().ToString()
          $pwd = ConvertTo-SecureString -String $plain -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP "test.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath out/Scan2PdfBridge-Test.cer | Out-Null
          Copy-Item out/Scan2PdfBridge-Store.msix out/Scan2PdfBridge-Test.msix
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $plain out/Scan2PdfBridge-Test.msix
          if ($LASTEXITCODE -ne 0) { throw "test signing failed" }
          Remove-Item $pfx -Force
          Copy-Item bridge/Package/Install-TestPackage.ps1 out/

      - name: Package test kit
        shell: pwsh
        run: |
          Compress-Archive -Path out/Scan2PdfBridge-Test.msix, out/Scan2PdfBridge-Test.cer, out/Install-TestPackage.ps1 `
            -DestinationPath Scan2PdfBridge-StoreTest-x64.zip -Force
          Copy-Item out/Scan2PdfBridge-Store.msix "Scan2PdfBridge-$env:MSIX_VERSION-Store.msix"
          Get-ChildItem *.zip, *.msix | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" } >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Scan2PdfBridge-msix
          path: |
            Scan2PdfBridge-*-Store.msix
            Scan2PdfBridge-StoreTest-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            Scan2PdfBridge-*-Store.msix
            Scan2PdfBridge-StoreTest-x64.zip
